<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>당근이의 핫플 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/rsc/hot.css" />
  <!-- Leaflet 라이브러리 및 분리된 자바스크립트 연결 -->
</head>
<body>
  <div class="hot-title">
    <span class="hot-title__name">당근이의 핫플 지도</span>
    <span class="hot-title__visit">
      방문자 수: <span id="visit-count">로딩중...</span>
    </span>
    <div class="hot-search">
      <input id="search-input" type="search" placeholder="예: 신화 짬뽕" autocomplete="off" />
      <button id="search-btn" type="button">검색</button>
    </div>
    <div id="search-msg" class="hot-search__msg"></div>
  </div>
  <div id="loading">장소 불러오는 중...</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/rsc/hot.js"></script>    
</body>
</html>
