<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>당근강의실 - 인트로</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #4B3621;
            font-family: 'Pretendard', sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 90%; /* 화면의 90% 공간 사용 */
            max-width: 500px; /* 최대 크기 제한 */
            opacity: 0;
            animation: fadeInOut 2.5s ease-in-out forwards;
        }

        img {
            width: 30%; /* 부모 컨테이너 대비 비율로 설정 */
            max-width: 150px;
            min-width: 80px;
            margin-bottom: 20px;
        }

        h1 {
            /* 화면 크기에 따라 1.5rem ~ 2rem 사이에서 자동 조절 */
            font-size: clamp(1.2rem, 5vw, 2rem);
            font-weight: 300;
            color: #FFFFFF;
            margin: 10px 0;
        }

        h3 {
            font-size: clamp(0.8rem, 3vw, 1rem);
            color: #D2B48C;
            font-weight: 200;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>

    <script>
        // 2.5초 후 /hot/ 경로로 자동 이동
        setTimeout(function() {
            window.location.href = "/hot/";
        }, 3000);
    </script>
    
</head>
<body>

    <div class="container">
        <!--<img src="coffee.png" alt="로딩중">-->
        <img src="{{ url_for('static', filename='coffee.png') }}" alt="로딩중">
        <h1>야, 어디 괜찮은 식당 없냐?</h1>
        <h2>지도로 내가 바로 보여줄께</h2>
        <h3>carroty.com/hot</h3>
    </div>
</body>
</html>
